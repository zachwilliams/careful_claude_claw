[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careful-claude-claw"
version = "0.1.0"
description = "Security-first Python orchestrator that uses the Claude Code Agent SDK for autonomous, scheduled, and event-driven AI workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "apscheduler>=3.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "claude-agent-sdk>=0.1.44",
    "slack-bolt>=1.27.0",
    "slack-sdk>=3.41.0",
    "aiohttp>=3.13.3",
    "ptyprocess>=0.7",
    "psutil>=5.9",
    "textual>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
claw = "careful_claude_claw.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["careful_claude_claw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires live Claude CLI"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
